name: Release

# Every push to main: run the tests, build a signed release APK and publish it as a GitHub release.
# The app checks these releases and updates itself (Settings → App updates).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Version MAJOR.MINOR.PATCH: PATCH counts releases since the run that started this MINOR.
      # For a new minor (e.g. 1.2), set MINOR and FIRST_RUN to the next run number.
      MAJOR: 1
      MINOR: 1
      FIRST_RUN: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Version
        run: echo "VERSION=$MAJOR.$MINOR.$(( ${{ github.run_number }} - FIRST_RUN ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (platform 37)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.SAX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Add the repository secret SAX_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          SAX_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SAX_KEYSTORE_PASSWORD: saxpractice
          SAX_KEY_ALIAS: saxpractice
        run: |
          ./gradlew assembleRelease -PversionCode=$((100 + ${{ github.run_number }})) -PversionName=$VERSION --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "SuperSax-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -10 --pretty='- %s' > notes.md
          gh release create "v$VERSION" "SuperSax-$VERSION.apk" --title "Super Sax $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
